# robot_localization for this platform: wheels give forward speed, the gyro gives
# yaw rate. That split is the whole point -- wheel-derived heading is the first
# thing to go wrong when the rover slips or bumps something, and the IMU does not
# care about traction.
#
# The filter owns odom -> base_link from here on, so the DiffDrive plugin no
# longer publishes tf. /odom stays on the bus as the raw wheel estimate, which is
# what makes the comparison against /ground_truth possible.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true          # planar robot: z, roll and pitch are not estimated
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom         # local, continuous estimate -- no map corrections here

    # x     y     z
    # roll  pitch yaw
    # vx    vy    vz
    # vroll vpitch vyaw
    # ax    ay    az
    odom0: /odom/cov
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
