[pytest]
testpaths = tests
# simops and worldgen are installed (editable) into the pixi env; importlib mode lets test
# modules in tests/simops and tests/worldgen share basenames
log_cli = true
log_cli_level = INFO
# Three kinds of tests, apart: unmarked -- in memory; `generating_files` -- writes real files (in
# pytest's temporary directories) but starts no container; `docker` -- starts sessions in Docker,
# minutes each. `pixi run test` runs the first two, `pixi run pytest -m <mark>` one kind alone.
markers =
    docker: starts a session in Docker
    generating_files: writes real files (in temporary directories), starts no container
# launch_testing (ROS, from the pixi env) collects on its own and ignores norecursedirs: `pytest .`
# (VS Code's discovery) walked .pixi/ and failed on the site-packages' own tests. No launch tests here.
addopts = -m "not docker" --import-mode=importlib -p no:launch_testing -p no:launch_ros
