[pytest]
testpaths = sim launch
# tests live in sim/tests, the modules they import are one level up, and sim/
# is a folder of scripts rather than an importable package
pythonpath = sim
log_cli = true
log_cli_level = INFO
# `docker`: starts scenarios in Docker, minutes each; run with `pixi run pytest -m docker`
markers =
    docker: starts a scenario in Docker
addopts = -m "not docker"
