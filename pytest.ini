[pytest]
testpaths = tests
# simops and worldgen are installed (editable) into the pixi env; importlib mode lets test
# modules in tests/simops and tests/worldgen share basenames
log_cli = true
log_cli_level = INFO
# `docker`: starts sessions in Docker, minutes each; run with `pixi run pytest -m docker`
# `generating_files`: writes real files (tmp_path, build/); `pixi run test` skips them, run them
# with `pixi run pytest -m "generating_files and not docker"`
markers =
    docker: starts a session in Docker
    generating_files: writes real files (tmp_path or build/)
addopts = -m "not docker and not generating_files" --import-mode=importlib
