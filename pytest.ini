# ROS 2 jazzy ships launch_testing plugins written against pytest 7; under the
# pytest in this environment they break collection before any test runs, and
# nothing here uses them.
[pytest]
addopts = -p no:launch_testing -p no:launch_ros
testpaths = sim launch
# tests live in sim/tests, the modules they import are one level up, and sim/
# is a folder of scripts rather than an importable package
pythonpath = sim
filterwarnings =
    # lark comes in with the ROS Python stack and still imports the sre_* modules
    # Python 3.12 deprecated. Not ours to fix, and not worth reading every run.
    ignore:module 'sre_parse' is deprecated:DeprecationWarning
    ignore:module 'sre_constants' is deprecated:DeprecationWarning
log_cli = true
log_cli_level = INFO
