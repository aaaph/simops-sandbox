# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Include Jupyter notebooks
extend-include = ["*.ipynb"]

# Same as Black.
line-length = 115
indent-width = 4


target-version = "py314"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["ALL"]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "EM101",  # Exception must not use a string literal, assign to variable first
    "TRY003", # Avoid specifying long messages outside the exception class
    "D211",   # Fix warning incompatibility: no-blank-line-before-class
    "D212",   # Fix warning incompatibility: multi-line-summary-first-line
    "COM812", # Removed by warning in format API
    "D203",   # Removed by warning in format API
    "G004",   # Checks for uses of f-strings to format logging messages.
    "ERA001", # Error code should be a constant
    "CPY001", # Project does not require copyright notices in every source file
    "D213",   # Mutually exclusive with D212 above; summaries start on the first line here
    "EM102",  # Same call as EM101 above, for f-strings
    "INP001", # Launch files and scripts, run by path -- nothing here is importable
    "S314",   # The XML parsed is this repo's own model.sdf
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = [
    "D", # Dont fix docstyle from others
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[lint.per-file-ignores]
# ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
"sim/stack.py" = [
    "T201", # A CLI reports by printing
    "S603", # Every command it runs is a constant in the file, not outside input
    "S607", # `gz`, `ps` and `pixi` are looked up on PATH on purpose
]
"sim/simops.py" = [
    "T201", # A CLI reports by printing
    "S603", # It runs docker and gz, or the command its user passed after --
    "S607", # `docker` and `gz` are looked up on PATH on purpose
]
"sim/doctor.py" = [
    "T201", # A diagnostic tool reports by printing
    "S607", # `gz` and `ps` are looked up on PATH on purpose
]
"sim/generate_temp_room_world.py" = [
    "T201",    # A CLI generator reports what it generated
    "S311",    # Map layout wants a seeded RNG, not a cryptographic one
    "S101",    # The reachability assert is the check that the map is usable
    "PLR0913", # An SDF model really does take that many fields
    "PLR0917",
]
"test_*.py" = [
    "ANN",     # Ignore Annotation rules in tests
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "D103",    # Missing docstring in public function
]

[lint.isort]
known-third-party = ["pydbow3"]
