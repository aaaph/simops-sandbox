# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      # Same binaries and versions as `pixi run lint` / `pixi run format`, so a
      # commit cannot pass a check that the tasks fail. --frozen keeps pixi from
      # re-solving the lock on every commit.
      - id: ruff-check
        name: ruff check
        entry: pixi run --frozen ruff check --fix --show-fixes
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: pixi run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty-check
        name: ty check
        # ty reads ty.toml for the file set, and a type error can come from a file
        # the commit does not touch, so it always runs over everything.
        entry: pixi run --frozen ty check
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-xml
        # Gazebo's formats are XML under other extensions, and identify does not
        # know that, so the hook's own `types: [xml]` filter would skip them all.
        name: check xml (sdf, world, urdf included)
        types: [file]
        files: \.(xml|sdf|world|urdf|xacro)$
