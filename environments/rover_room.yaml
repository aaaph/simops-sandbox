# An environment: which world and which agents in it -- no action. Each agent's autopilot
# (airframe and PX4 firmware) comes from its platform (`autopilot.px4`).
# `pixi run simops build` turns it into a bundle in build/<name>/ (compose.yaml + the world
# and platforms it uses), `up` runs the bundle as a session. Paths are relative to this file.
name: rover_room

# true: every agent's topics under /<agent name>/ (/rover1/scan, /rover1/fmu/out/...),
# even with one agent. Required for more than one.
namespaces: true

network:
  router_port: 7447 # where ROS and the gz GUI on the host connect
  mavlink_port: 14540 # UDP, where rover1's PX4 sends its API link (udpin://0.0.0.0:14540); agent i: +i

world:
  # generated by worldgen (src/worldgen/room.py), same seed -> same room;
  # or `file: ../worlds/<some>.sdf` for a ready-made world
  generate_room: { size: [25, 21], seed: 1337 }

agents:
  rover1: # the model's name in gz
    platform: ../platforms/rover_differential_lidar_px4 # its platform.yaml; or the platform inline
    pose: [0, 0, 0.2]
  rover11:
    platform:
      model: ../platforms/rover_differential_lidar_px4/model.sdf
      autopilot:
        px4:
          airframe: 50000
          version: v1.18.0-rc1
      bridge:
        - ros_topic_name: "/scan"
          gz_topic_name: "/scan"
          ros_type_name: "sensor_msgs/msg/LaserScan"
          gz_type_name: "gz.msgs.LaserScan"
          direction: GZ_TO_ROS
        - ros_topic_name: "/scan/points"
          gz_topic_name: "/scan/points"
          ros_type_name: "sensor_msgs/msg/PointCloud2"
          gz_type_name: "gz.msgs.PointCloudPacked"
          direction: GZ_TO_ROS
        - ros_topic_name: "/ground_truth"
          gz_topic_name: "/ground_truth"
          ros_type_name: "nav_msgs/msg/Odometry"
          gz_type_name: "gz.msgs.Odometry"
          direction: GZ_TO_ROS
    pose: [0, 0, 0.2]
