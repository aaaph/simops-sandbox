# An environment: which world and which agents in it -- no action. Each agent's autopilot
# (airframe and PX4 firmware) comes from its platform's agent.yaml.
# `pixi run simops build` turns it into a bundle in build/<name>/ (compose.yaml + the world
# and platforms it uses), `up` runs the bundle as a session. Paths are relative to this file.
name: rover_room

# true: every agent's topics under /<agent name>/ (/rover1/scan, /rover1/fmu/out/...),
# even with one agent. Required for more than one.
namespaces: false

network:
  router_port: 7447 # where ROS and the gz GUI on the host connect

world:
  # generated by worldgen (src/worldgen/room.py), same seed -> same room;
  # or `file: ../worlds/<some>.sdf` for a ready-made world
  generate_room: { seed: 43, size: [25, 21] }

agents:
  rover1: # the model's name in gz
    platform: ../platforms/rover_differential_lidar_px4 # model.sdf, bridge.yaml, agent.yaml
    pose: [0, 0, 0.2]
