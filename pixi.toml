[workspace]
authors = ["Ivan Aphanasyev <nekaktotak2@gmail.com>"]
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge",
]
name = "simops-sandbox"
platforms = ["osx-arm64"]
version = "0.1.0"

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
GZ_SIM_RESOURCE_PATH = "$PIXI_PROJECT_ROOT/models:$PIXI_PROJECT_ROOT/worlds:$PIXI_PROJECT_ROOT/platforms"

[tasks]
world = "python sim/generate_temp_room_world.py --seed 42 --size 20 16 -o worlds/temp_room.sdf"
zenoh = "ros2 run rmw_zenoh_cpp rmw_zenohd"
bringup = { cmd = "ros2 launch launch/bringup.launch.py", depends-on = [
    "world",
] }
# async_slam_toolbox_node is a lifecycle node: run bare it never leaves the
# unconfigured state. The shipped launch does the configure+activate.
slam = "ros2 launch slam_toolbox online_async_launch.py slam_params_file:=platforms/rover_differential_lidar/slam.yaml use_sim_time:=true"
rerun_bridge = "python sim/rerun_bridge.py --ros-args -p use_sim_time:=true"
doctor = "python sim/doctor.py"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p use_sim_time:=true"
lint = "ruff check --fix --show-fixes && ty check"
test = "pytest"
format = "ruff format"

[dependencies]
gz-sim = ">=8.10,<9"   # Harmonic: the version ros-jazzy-ros-gz and PX4 both target
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9,<0.3"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ros-gz = ">=1.0.22,<2"
ros-jazzy-slam-toolbox = ">=2.8.5,<3"
ros-jazzy-nav2-bringup = ">=1.3.12,<2"
ros-jazzy-robot-localization = ">=3.8.3,<4"
ruff = ">=0.16.5,<0.17"
ty = ">=0.0.78,<0.0.79"
pytest = ">=9.1.1,<10"
scipy = ">=1.18.0,<2"
pre-commit = ">=4.6.2,<5"

[pypi-dependencies]
rerun-sdk = "==0.36.*"
