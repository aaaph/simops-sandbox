[workspace]
authors = ["Ivan Aphanasyev <nekaktotak2@gmail.com>"]
channels = [
    "https://prefix.dev/robostack-lyrical",
    "https://prefix.dev/conda-forge",
]
name = "simops-sandbox"
# the Lyrical builds (qt6 via moltenvk) need macOS 14; pixi assumes older unless told
platforms = [{ platform = "osx-arm64", macos = "14.0" }]
version = "0.1.0"

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
# the native GUI loads the agents' meshes (model://<platform>/...) from here
GZ_SIM_RESOURCE_PATH = "$PIXI_PROJECT_ROOT/platforms"

[tasks]
# scenarios in Docker: world + agents + autopilot from one YAML, see sim/simops.py
simops = "python sim/simops.py"
lint = "ruff check --fix --show-fixes && ty check"
test = "pytest"
format = "ruff format"

[dependencies]
gz-sim = ">=10.5,<11"   # Jetty, as in the Docker images: the native GUI talks to their server
ros-lyrical-rmw-zenoh-cpp = ">=0.10.5,<0.11"
ros-lyrical-desktop = ">=0.13.0,<0.14"
ruff = ">=0.16.5,<0.17"
ty = ">=0.0.78,<0.0.79"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"
typer = ">=0.27.2,<0.28"
testcontainers = ">=4.14.1,<5"
