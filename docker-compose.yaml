# The PX4 commit the firmware (px4) is built at. The companion's px4_msgs must
# come from the same commit — their RIHS01 type hashes are part of the zenoh
# key, so any drift silently cuts the /fmu topics: build infra/companion.Dockerfile
# (not in this file) with the same PX4_REF when you bump it.
x-px4-source: &px4-source
  PX4_REPO: https://github.com/PX4/PX4-Autopilot.git
  # 2026-09-25, fix(simulation): cast gz airspeed temperature to double (#28843)
  PX4_REF: 4dbd2e069a5c30c2e53e47e842095d2576dc38c4

services:
  zenoh-router:
    build:
      context: .
      dockerfile: infra/ros2.Dockerfile
    container_name: zenoh-router
    restart: always
    ports:
      - "7447:7447/tcp"
      - "7447:7447/udp"
    environment:
      # Connects (client address, peer/client), sessions opened and closed;
      # everything else at info. docker logs -f zenoh-router
      - RUST_LOG=zenoh=info,zenoh_link_tcp::unicast=debug,zenoh_transport::unicast::manager=debug,zenoh::net::routing::dispatcher::face=debug
    command: ros2 run rmw_zenoh_cpp rmw_zenohd

  m1-heartbeat:
    build:
      context: .
      dockerfile: infra/ros2.Dockerfile
    container_name: router-heartbeat
    restart: always
    depends_on:
      - zenoh-router
    environment:
      - ZENOH_CONFIG_OVERRIDE=mode="client";connect/endpoints=["tcp/zenoh-router:7447"]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    command: >
      ros2 topic pub /m1_heartbeat std_msgs/msg/Int32 "{data: 1}" --rate 1

  # gz Jetty server with the room (pixi run world), gz-transport over zenoh:
  # the macOS GUI and PX4 attach through the router. Robots come with PX4.
  world:
    build:
      context: .
      dockerfile: infra/world.Dockerfile
    container_name: world
    # Shares the router's network namespace (localhost:7447 is the router).
    network_mode: service:zenoh-router
    depends_on:
      # When the router restarts, this container is left in its old network
      # namespace with no network. Restart with it.
      zenoh-router:
        condition: service_started
        restart: true
    environment:
      - SIM_WORLD=temp_room
      # Same partition and router endpoint on every gz-transport peer (world,
      # PX4, the macOS GUI); the default partition is <hostname>:<user>.
      - GZ_PARTITION=sim
      - GZ_TRANSPORT_ZENOH_CONFIG_OVERRIDE=mode="peer";connect/endpoints=["tcp/localhost:7447"];scouting/multicast/enabled=false
    volumes:
      - ./worlds:/sim/worlds:ro
      - ./platforms:/sim/platforms:ro

  # PX4 SITL (zenoh) joining the world with its rover: /fmu/* on the router.
  px4:
    build:
      context: .
      dockerfile: infra/px4.Dockerfile
      args: *px4-source
    container_name: px4
    network_mode: service:zenoh-router
    depends_on:
      # Sharing the router's network namespace: when the router restarts,
      # this container is left in the old one with no network. Restart with it.
      zenoh-router:
        condition: service_started
        restart: true
      # A restarted world loses the rover and the scene.
      world:
        condition: service_started
        restart: true
    environment:
      - GZ_PARTITION=sim
      - GZ_TRANSPORT_ZENOH_CONFIG_OVERRIDE=mode="peer";connect/endpoints=["tcp/localhost:7447"];scouting/multicast/enabled=false
      - PX4_GZ_WORLD=room
      # Parameters from the gz_rover_differential airframe, body from platforms/.
      - PX4_SYS_AUTOSTART=50000
      - PX4_SIM_MODEL=gz_rover_differential_lidar_px4
      # Resolved by the world's gz server, where platforms/ is mounted.
      - PX4_GZ_MODELS=/sim/platforms
      - PX4_GZ_MODEL_POSE=0,0,0.2
      # PX4 otherwise locks the GUI camera onto the rover it spawns.
      - PX4_GZ_NO_FOLLOW=1

  # The sim's stand-in for the rover's sensor drivers: ros_gz_bridge with the
  # platform's bridge.yaml puts the lidar, /clock and ground truth on ROS 2.
  # The companion software (ros/src, platforms/<robot>/launch) is not run here.
  sim-sensors:
    build:
      context: .
      dockerfile: infra/sim-sensors.Dockerfile
    container_name: sim-sensors
    network_mode: service:zenoh-router
    depends_on:
      zenoh-router:
        condition: service_started
        restart: true
      # A restarted world loses the rover and its sensors.
      world:
        condition: service_started
        restart: true
    environment:
      - BRIDGE_CONFIG=/sim/platforms/rover_differential_lidar_px4/bridge.yaml
      # gz side, same as the world and PX4
      - GZ_PARTITION=sim
      - GZ_TRANSPORT_ZENOH_CONFIG_OVERRIDE=mode="peer";connect/endpoints=["tcp/localhost:7447"];scouting/multicast/enabled=false
      # ROS side
      - ZENOH_CONFIG_OVERRIDE=mode="client";connect/endpoints=["tcp/localhost:7447"]
    volumes:
      - ./platforms:/sim/platforms:ro
